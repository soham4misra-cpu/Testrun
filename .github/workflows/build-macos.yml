name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "main.spec"
      - "images/**"
      - "audios/**"
      - "requirements.txt"
      - ".github/workflows/build-macos.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build main.app
        run: pyinstaller main.spec --clean --noconfirm

      - name: Zip app bundle
        # ditto (not plain zip) preserves the .app bundle structure correctly
        run: ditto -c -k --sequesterRsrc --keepParent dist/main.app main-macos.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: game-macos-app
          path: main-macos.zip
